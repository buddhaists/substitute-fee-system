  <script>
    // 取得絕對可靠的 GAS Web App 基底 URL (多軌備援，嚴格排斥 googleusercontent)
    function getSafeBaseUrl() {
      var sUrl = (typeof SERVER_APP_URL !== 'undefined' && SERVER_APP_URL) ? String(SERVER_APP_URL).trim() : '';
      if (!sUrl && typeof serverUrl !== 'undefined' && serverUrl) {
        sUrl = String(serverUrl).trim();
      }
      if (sUrl && sUrl.indexOf('https://script.google.com') === 0) {
        return sUrl.split('?')[0];
      }
      if (typeof document !== 'undefined' && document.referrer && document.referrer.indexOf('https://script.google.com') === 0) {
        return document.referrer.split('?')[0];
      }
      try {
        var stored = localStorage.getItem('gas_web_app_url');
        if (stored && stored.indexOf('https://script.google.com') === 0) {
          return stored.trim().split('?')[0];
        }
      } catch (e) {}
      if (typeof window !== 'undefined' && window.location && window.location.href && window.location.href.indexOf('https://script.google.com') === 0) {
        return window.location.href.split('?')[0];
      }
      if (sUrl && sUrl.indexOf('http') === 0 && sUrl.indexOf('googleusercontent.com') === -1) {
        return sUrl.split('?')[0];
      }
      return '';
    }

    // 頂層安全導航跳轉 (專門解決 GAS iframe 跨域被攔截與拒絕連線問題)
    function navTo(page, params) {
      var baseUrl = getSafeBaseUrl();
      var target = baseUrl;

      if (page) {
        target = baseUrl ? (baseUrl + '?page=' + encodeURIComponent(page)) : ('?page=' + encodeURIComponent(page));
      }

      if (params && typeof params === 'object') {
        var qs = [];
        for (var k in params) {
          if (params[k] !== undefined && params[k] !== null && params[k] !== '') {
            qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
          }
        }
        if (qs.length > 0) {
          target += (target.indexOf('?') === -1 ? '?' : '&') + qs.join('&');
        }
      }

      // 1. 最核心機制：動態建立 <a target="_top"> 觸發原生使用者點擊
      try {
        var link = document.createElement('a');
        link.href = target;
        link.target = '_top';
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        setTimeout(function() {
          if (link && link.parentNode) link.parentNode.removeChild(link);
        }, 200);
        return;
      } catch (e) {}

      // 2. 備援跳轉
      try {
        if (window.top && window.top !== window) {
          window.top.location.href = target;
          return;
        }
      } catch (e) {}

      window.location.href = target;
    }

    // 動態更新導覽列所有超連結 href
    function updateNavbarHrefs() {
      var base = getSafeBaseUrl();
      if (!base) return;
      document.querySelectorAll('.top-navbar a[data-page]').forEach(function(el) {
        var p = el.getAttribute('data-page');
        el.href = p ? (base + '?page=' + p) : base;
      });
      document.querySelectorAll('.grid-portal a.portal-card').forEach(function(el) {
        var href = el.getAttribute('href') || '';
        if (href.indexOf('?page=') !== -1) {
          var p = href.split('?page=')[1].split('&')[0];
          el.href = base + '?page=' + p;
        }
      });
    }

    try {
      updateNavbarHrefs();
    } catch (e) {}

    const isGasEnv = typeof google !== 'undefined' && google.script && google.script.run;
    function applySchoolName(settings) {
      if (!settings) return;
      if (settings.school_name) {
        document.title = `${settings.school_name} - 代課費計算與管理系統`;
        document.getElementById('nav-school-name').textContent = settings.school_name;
        document.getElementById('portal-sub-text').textContent = `${settings.school_name} 專屬 ─ 請選擇您要進入的模組`;
        document.getElementById('footer-school-name').textContent = settings.school_name;
      }
      const mTitle = settings.maintainer_title || settings.admin_title || '資訊執秘';
      const mName = settings.maintainer_name || settings.admin_name || '蔡志益';
      const footerM = document.getElementById('footer-maintainer');
      if (footerM) footerM.textContent = `${mTitle} ${mName}`;
    }
    if (typeof SERVER_SYSTEM_SETTINGS !== 'undefined' && SERVER_SYSTEM_SETTINGS) {
      applySchoolName(SERVER_SYSTEM_SETTINGS);
    }
    if (isGasEnv) {
      google.script.run.withSuccessHandler(applySchoolName).getSystemSettingsData();
    }

    // ============================================================
    // ⚡ 全校課表背景極速預載 (Idle Prefetching)
    // 當使用者在首頁停留時，利用瀏覽器閒置時間在背景預熱課表存入 LocalStorage，
    // 讓使用者稍後點進課表時達到 0 毫秒極速瞬開！
    // ============================================================
    function prefetchTimetableData() {
      const CACHE_KEY = 'sub_timetable_data_cache_v2';
      const CACHE_TIME_KEY = 'sub_timetable_cache_timestamp';
      try {
        const cachedTime = Number(localStorage.getItem(CACHE_TIME_KEY) || 0);
        // 若快取時間在 1 小時內且已有資料，代表已極新，不重複消耗請求
        if (Date.now() - cachedTime < 60 * 60 * 1000 && localStorage.getItem(CACHE_KEY)) {
          return;
        }
      } catch (e) {}

      if (isGasEnv) {
        google.script.run
          .withSuccessHandler(function(res) {
            try {
              var data = (res && res.success && res.data) ? res.data : res;
              if (data && (data.classes || data.db)) {
                localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
                console.log("⚡ [預載完成] 全校課表已在背景安靜預熱至 LocalStorage！");
              }
            } catch (err) {}
          })
          .getScheduleData();
      }
    }

    setTimeout(function() {
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(prefetchTimetableData);
      } else {
        prefetchTimetableData();
      }
    }, 350);
  </script>
