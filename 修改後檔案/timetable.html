let DB = null;

window.addEventListener("DOMContentLoaded", () => {
  initData();
  startLiveClock();
});

function initData() {
  if (typeof google !== "undefined" && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler((res) => {
        try {
          if (res && res.success && res.data && Array.isArray(res.data.classes) && res.data.classes.length > 0) {
            DB = res.data;
          } else if (res && Array.isArray(res.classes) && res.classes.length > 0) {
            DB = res;
          } else {
            DB = EMBEDDED_DATA;
          }
        } catch(e) {
          DB = EMBEDDED_DATA;
        }
        setupUI();
      })
      .withFailureHandler(() => {
        DB = EMBEDDED_DATA;
        setupUI();
      })
      .getScheduleData();
  } else {
    DB = EMBEDDED_DATA;
    setupUI();
  }
}

function setupUI() {
  try {
    populateClassSelect();
    populateTeacherSelect();
    setupGradeChips();
    renderClassTimetable();
    renderTeacherTimetable();
    renderRoomTimetable();
    setLiveToCurrentTime();
  } catch(e) {
    console.error("setupUI error:", e);
  }
}

function switchTab(tabId) {
  document.querySelectorAll(".tab-view").forEach(el => el.style.display = "none");
  document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
  
  document.getElementById(`view-${tabId}`).style.display = "block";
  event.currentTarget.classList.add("active");

  if (tabId === 'live') {
    renderLivePeriod();
  }
}

function getSubjectTheme(subj) {
  if (!subj || subj === "（無排課）" || subj === "—" || subj === "無課") return "theme-default";
  if (subj.includes("國語") || subj.includes("語文") || subj.includes("寫作")) return "theme-mandarin";
  if (subj.includes("數學") || subj.includes("幾何")) return "theme-math";
  if (subj.includes("英語") || subj.includes("國際") || subj.includes("美語") || subj.includes("雙語")) return "theme-english";
  if (subj.includes("自然") || subj.includes("科學") || subj.includes("生物")) return "theme-science";
  if (subj.includes("社會") || subj.includes("歷史") || subj.includes("地理")) return "theme-social";
  if (subj.includes("生活") || subj.includes("品格")) return "theme-life";
  if (subj.includes("音樂") || subj.includes("美勞") || subj.includes("藝術") || subj.includes("視覺") || subj.includes("表演")) return "theme-art";
  if (subj.includes("體育") || subj.includes("健康") || subj.includes("健體") || subj.includes("桌球") || subj.includes("游泳")) return "theme-pe";
  if (subj.includes("資訊") || subj.includes("科技") || subj.includes("電腦") || subj.includes("程式")) return "theme-info";
  if (subj.includes("本土") || subj.includes("閩") || subj.includes("客") || subj.includes("原")) return "theme-local";
  return "theme-default";
}

function populateClassSelect() {
  const select = document.getElementById("select-class");
  select.innerHTML = "";
  const classList = [...new Set(DB.classes.map(c => String(c["班級/教室"] || c["班級"])))].filter(Boolean).sort();
  classList.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = `${c} 班`;
    select.appendChild(opt);
  });
}

function setupGradeChips() {
  const container = document.getElementById("grade-chips-container");
  container.innerHTML = "";
  const grades = [
    { label: "一年級", prefix: "1" },
    { label: "二年級", prefix: "2" },
    { label: "三年級", prefix: "3" },
    { label: "四年級", prefix: "4" },
    { label: "五年級", prefix: "5" },
    { label: "六年級", prefix: "6" }
  ];

  grades.forEach((g, idx) => {
    const btn = document.createElement("button");
    btn.className = `chip-btn ${idx === 0 ? "active" : ""}`;
    btn.textContent = g.label;
    btn.onclick = () => {
      document.querySelectorAll(".chip-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const firstClass = [...new Set(DB.classes.map(c => String(c["班級/教室"] || c["班級"])))]
        .filter(c => c.startsWith(g.prefix))[0];
      if (firstClass) {
        document.getElementById("select-class").value = firstClass;
        renderClassTimetable();
      }
    };
    container.appendChild(btn);
  });
}

function renderClassTimetable() {
  const selectedClass = document.getElementById("select-class").value;
  const classRows = DB.classes.filter(c => String(c["班級/教室"] || c["班級"]) === selectedClass);
  
  const homeroom = classRows.length > 0 ? (classRows[0]["導師"] || "未指定") : "未指定";
  const grade = classRows.length > 0 ? (classRows[0]["年級"] || "") : "";

  document.getElementById("class-table-title").innerHTML = `🏫 ${selectedClass} 班級週課表 <span style="font-size:0.85rem;font-weight:600;color:var(--text-muted);">(${grade})</span>`;
  document.getElementById("class-homeroom-info").textContent = `導師：${homeroom} 老師`;

  const activeCount = classRows.filter(r => r["科目"] && r["科目"] !== "（無排課）" && r["科目"] !== "—" && r["科目"] !== "無課").length;
  document.getElementById("class-period-stats").textContent = `每週 ${activeCount} 節`;

  const table = document.getElementById("class-timetable-grid");
  const currentSlot = getCurrentPeriodSlot();

  let html = `<thead><tr><th class="th-period">節次 / 時間</th>`;
  DAYS.forEach((d, idx) => {
    const isToday = currentSlot && currentSlot.dayIdx === idx;
    html += `<th class="${isToday ? 'today-col' : ''}">${d}</th>`;
  });
  html += `</tr></thead><tbody>`;

  PERIODS.forEach(p => {
    html += `<tr>`;
    html += `<th class="th-period"><strong>${p.name}</strong><br><span style="font-size:0.72rem;color:var(--text-muted);">${p.time}</span></th>`;
    
    DAYS.forEach((d, dIdx) => {
      const slot = classRows.find(r => (r["星期"] === d || r["星期"] === (dIdx+1)) && (r["節次"] === p.name || Number(r["節次序號"]) === p.id || Number(r["節次"]) === p.id));
      const isCurrent = currentSlot && currentSlot.dayIdx === dIdx && currentSlot.periodId === p.id;
      
      const subj = slot ? (slot["科目"]) : "";
      if (subj && subj !== "（無排課）" && subj !== "—" && subj !== "無課") {
        const theme = getSubjectTheme(subj);
        const tea = slot["上課老師"] || slot["授課教師"] || "";
        const loc = slot["上課地點"] || slot["專科教室"] || "";
        html += `<td class="${isCurrent ? 'current-period-cell' : ''}">
          <div class="cell-box ${theme}">
            <div class="subj-title">${subj}</div>
            <div class="subj-teacher">${tea && tea !== '—' ? tea + ' 老師' : ''}</div>
            ${loc ? `<div class="subj-loc">📍${loc}</div>` : ''}
            ${(tea && tea !== '—') ? `<button type="button" class="btn-sub-quick" onclick="applySubstitute('${selectedClass}', '${tea}', '${p.id}', '${dIdx}'); event.stopPropagation();" title="申報此節代課">👉 申報代課</button>` : ''}
          </div>
        </td>`;
      } else {
        html += `<td class="${isCurrent ? 'current-period-cell' : ''}"><div class="empty-period">—</div></td>`;
      }
    });
    html += `</tr>`;
  });

  html += `</tbody>`;
  table.innerHTML = html;
}

function populateTeacherSelect() {
  const select = document.getElementById("select-teacher");
  select.innerHTML = "";
  const teacherList = [...new Set(DB.teachers.map(t => String(t["上課老師"] || t["教師姓名"])))].filter(Boolean).sort((a,b) => a.localeCompare(b, 'zh-Hant'));
  teacherList.forEach(t => {
    const tRows = DB.teachers.filter(r => (r["上課老師"] === t || r["教師姓名"] === t));

function filterRoomCategory(cat, btnEl) {
  const chipBtns = document.querySelectorAll("#room-category-chips .chip-btn");
  chipBtns.forEach(b => b.classList.remove("active"));
  if (btnEl) btnEl.classList.add("active");

  const select = document.getElementById("select-room");
  const options = Array.from(select.querySelectorAll("option"));
  
  if (cat === "all") {
    options.forEach(opt => {
      opt.style.display = "";
      if (opt.parentElement) opt.parentElement.style.display = "";
    });
  } else {
    options.forEach(opt => {
      const match = opt.getAttribute("data-cat") === cat;
      opt.style.display = match ? "" : "none";
    });
    const optgroups = select.querySelectorAll("optgroup");
    optgroups.forEach(og => {
      const visibleOpts = og.querySelectorAll("option:not([style*='display: none'])");
      og.style.display = visibleOpts.length > 0 ? "" : "none";
    });
    const firstVisible = options.find(opt => opt.getAttribute("data-cat") === cat);
    if (firstVisible) {
      select.value = firstVisible.value;
    }
  }
  renderRoomTimetable();
}

function startLiveClock() {
  const clockEl = document.getElementById("live-clock");
  function update() {
    const now = new Date();
    const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
    const dStr = days[now.getDay()];
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    
    const slot = getCurrentPeriodSlot();
    let status = "非上課時段";
    if (slot) {
      status = `${slot.dayName} 第${slot.periodId}節 (${slot.periodName})`;
    }
    clockEl.textContent = `${dStr} ${h}:${m}:${s} ‧ ${status}`;
  }
  update();
  setInterval(update, 1000);
}

function getCurrentPeriodSlot() {
  const now = new Date();
  const day = now.getDay();
  if (day < 1 || day > 5) return null;

  const dayIdx = day - 1;
  const dayName = DAYS[dayIdx];
  const mins = now.getHours() * 60 + now.getMinutes();

  const ranges = [
    { id: 0, name: "晨光時間", start: 7 * 60 + 45, end: 8 * 60 + 35 },
    { id: 1, name: "第1節", start: 8 * 60 + 40, end: 9 * 60 + 20 },
    { id: 2, name: "第2節", start: 9 * 60 + 30, end: 10 * 60 + 10 },
    { id: 3, name: "第3節", start: 10 * 60 + 30, end: 11 * 60 + 10 },
    { id: 4, name: "第4節", start: 11 * 60 + 20, end: 12 * 60 + 0 },
    { id: 5, name: "第5節", start: 13 * 60 + 30, end: 14 * 60 + 10 },
    { id: 6, name: "第6節", start: 14 * 60 + 20, end: 15 * 60 + 0 },
    { id: 7, name: "第7節", start: 15 * 60 + 10, end: 15 * 60 + 50 }
  ];

  const found = ranges.find(r => mins >= r.start && mins <= r.end);
  if (found) {
    return {
      dayIdx: dayIdx,
      dayName: dayName,
      periodId: found.id,
      periodName: found.name
    };
  }
  return null;
}

function navTo(page) {
  var serverUrl = "<?= appUrl ?>";
  var baseUrl = (serverUrl && serverUrl.indexOf('http') === 0) ? serverUrl.split('?')[0] : window.location.href.split('?')[0];
  baseUrl = baseUrl.replace(/\/userCodeAppPanel$/, '');
  var target = page ? (baseUrl + '?page=' + page) : baseUrl;
  try {
    if (window.top && window.top.location) {
      window.top.location.href = target;
      return;
    }
  } catch (e) {}
  window.location.href = target;
}

function applySubstitute(className, teacherName, periodId, dayIdx) {
  var serverUrl = "<?= appUrl ?>";
  var baseUrl = (serverUrl && serverUrl.indexOf('http') === 0) ? serverUrl.split('?')[0] : window.location.href.split('?')[0];
  baseUrl = baseUrl.replace(/\/userCodeAppPanel$/, '');
  
  // 計算本週對應星期幾的實際日期
  var now = new Date();
  var currentDay = now.getDay(); // 0: 日, 1: 一 ... 6: 六
  var targetDayNumber = Number(dayIdx) + 1; // 1~5
  var diffDays = targetDayNumber - (currentDay === 0 ? 7 : currentDay);
  
  var targetDate = new Date();
  targetDate.setDate(now.getDate() + diffDays);
  var y = targetDate.getFullYear();
  var m = String(targetDate.getMonth() + 1).padStart(2, '0');
  var d = String(targetDate.getDate()).padStart(2, '0');
  var dateStr = y + '-' + m + '-' + d;

  var target = baseUrl + '?page=teacher' +
    '&teacher=' + encodeURIComponent(teacherName || '') +
    '&class=' + encodeURIComponent(className || '') +
    '&period=' + encodeURIComponent(periodId || '') +
    '&date=' + encodeURIComponent(dateStr);

  // 優先使用 target="_top" 模擬超連結點擊，安全繞過 GAS iframe 跨域保護與參數遺失
  try {
    var link = document.createElement('a');
    link.href = target;
    link.target = '_top';
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    setTimeout(function() {
      if (link && link.parentNode) link.parentNode.removeChild(link);
    }, 150);
    return;
  } catch (e) {}

  try {
    if (window.top && window.top.location) {
      window.top.location.href = target;
      return;
    }
  } catch (e) {}
  window.location.href = target;
}
