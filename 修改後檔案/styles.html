<style>
/* Modern Design System for Substitute Teacher Fee System */
:root {
  --primary-color: #1e3a8a;
  --primary-hover: #172554;
  --secondary-color: #0284c7;
  --accent-color: #f59e0b;
  --bg-color: #f1f5f9;
  --card-bg: #ffffff;
  --text-color: #1e293b;
  --text-light: #64748b;
  --border-color: #e2e8f0;
  --success-color: #10b981;
  --danger-color: #ef4444;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  line-height: 1.5;
  padding: 1.5rem;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

/* Top Global Navigation Bar - Tiffany Green Theme */
.top-navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
  padding: 0.75rem 1.5rem;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow);
  border: 1px solid var(--border-color);
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.nav-brand {
  font-weight: 800;
  font-size: 1.15rem;
  color: #0d9488;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  text-decoration: none;
  transition: all 0.2s ease;
}

.nav-brand i {
  color: #0abab5;
}

.nav-brand:hover {
  color: #0f766e;
}

.nav-menu {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.nav-item {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.5rem 1rem;
  border-radius: var(--radius-sm);
  font-size: 0.92rem;
  font-weight: 600;
  text-decoration: none;
  color: #475569;
  transition: all 0.2s ease;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
}

.nav-item:hover {
  color: #0f766e;
  background: #f0fdfa;
  border-color: #99f6e4;
}

.nav-item.active {
  color: white;
  background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
  border-color: #0d9488;
  box-shadow: 0 2px 6px rgba(10, 186, 181, 0.35);
}

/* Header - Tiffany Green Theme */
header {
  position: relative;
  overflow: hidden;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
  background: linear-gradient(135deg, #1dd3bd 0%, #0abab5 35%, #0d9488 75%, #0f544f 100%);
  padding: 1.75rem 2rem;
  border-radius: var(--radius-lg);
  color: white;
  box-shadow: 0 10px 25px -5px rgba(10, 186, 181, 0.4), 0 8px 10px -6px rgba(13, 148, 136, 0.25);
  border: 1px solid rgba(255, 255, 255, 0.25);
  gap: 1rem;
  flex-wrap: wrap;
}

header::before {
  content: '';
  position: absolute;
  top: -40px;
  right: -40px;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 70%);
  pointer-events: none;
}

header::after {
  content: '';
  position: absolute;
  bottom: -30px;
  left: -30px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 70%);
  pointer-events: none;
}

header h1 {
  font-size: 1.75rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  color: #ffffff;
  text-shadow: 0 2px 4px rgba(0, 45, 45, 0.25);
  position: relative;
  z-index: 1;
}

header p {
  color: #e6fffa;
  font-size: 0.95rem;
  margin-top: 0.25rem;
  position: relative;
  z-index: 1;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}

.header-btn {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: white;
  padding: 0.45rem 0.85rem;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.88rem;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s;
}

.header-btn:hover {
  background: rgba(255, 255, 255, 0.32);
  color: white;
  transform: translateY(-1px);
}

.header-btn.active {
  background: white;
  color: #0d9488;
}

.nav-tabs {
  display: flex;
  gap: 0.5rem;
  background: rgba(255, 255, 255, 0.1);
  padding: 0.25rem;
  border-radius: var(--radius-md);
}

.tab-btn {
  background: none;
  border: none;
  color: #cbd5e1;
  padding: 0.5rem 1rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95rem;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.tab-btn:hover {
  color: white;
}

.tab-btn.active {
  background-color: white;
  color: var(--primary-color);
  box-shadow: var(--shadow);
}

/* Tab Content */
.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* Main Grid Layout */
.grid-layout {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 1.5rem;
}

@media (max-width: 968px) {
  .grid-layout {
    grid-template-columns: 1fr;
  }
}

/* Panels & Cards */
.panel {
  background-color: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow);
  margin-bottom: 1.5rem;
}

.panel-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  border-bottom: 2px solid var(--border-color);
  padding-bottom: 0.5rem;
}

/* Forms */
.form-group {
  margin-bottom: 1.25rem;
}

.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1.25rem;
}

label {
  display: block;
  font-weight: 600;
  font-size: 0.9rem;
  margin-bottom: 0.35rem;
  color: var(--text-color);
}

input[type="text"],
input[type="date"],
input[type="month"],
input[type="password"],
input[type="number"],
select {
  width: 100%;
  padding: 0.6rem 0.75rem;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 0.95rem;
  background-color: #f8fafc;
  color: var(--text-color);
  transition: all 0.2s;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--secondary-color);
  background-color: white;
  box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
}

/* Checkbox Tables */
.period-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 0.5rem;
}

.period-table th, .period-table td {
  padding: 0.6rem;
  text-align: left;
  border-bottom: 1px solid var(--border-color);
}

.period-table th {
  font-weight: 600;
  color: var(--text-light);
  font-size: 0.85rem;
  background-color: #f8fafc;
}

.period-table td input[type="text"] {
  padding: 0.4rem 0.5rem;
  font-size: 0.85rem;
}

.checkbox-container {
  display: flex;
  align-items: center;
  justify-content: center;
}

input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--secondary-color);
}

/* Acting Homeroom Teacher Section */
.acting-mentor-box {
  background-color: #f0fdf4;
  border: 1px dashed #bbf7d0;
  border-radius: var(--radius-md);
  padding: 1rem;
  margin-top: 1rem;
}

.acting-mentor-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 700;
  color: #166534;
  margin-bottom: 0.75rem;
}

/* Buttons */
.btn-group {
  display: flex;
  gap: 0.75rem;
  margin-top: 1.5rem;
}

.btn {
  padding: 0.65rem 1.25rem;
  font-size: 0.95rem;
  font-weight: 600;
  border-radius: var(--radius-sm);
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

.btn-primary {
  background-color: var(--primary-color);
  color: white;
}

.btn-primary:hover {
  background-color: var(--primary-hover);
}

.btn-secondary {
  background-color: #e2e8f0;
  color: var(--text-color);
}

.btn-secondary:hover {
  background-color: #cbd5e1;
}

.btn-success {
  background-color: var(--success-color);
  color: white;
}

.btn-success:hover {
  background-color: #059669;
}

.btn-danger {
  background-color: var(--danger-color);
  color: white;
}

.btn-danger:hover {
  background-color: #dc2626;
}

/* Statistics Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.stat-card {
  background-color: #f8fafc;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 1rem;
  text-align: center;
}

.stat-val {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--primary-color);
  margin-top: 0.25rem;
}

.stat-label {
  font-size: 0.8rem;
  color: var(--text-light);
  font-weight: 600;
}

/* Records Table */
.records-table-container {
  overflow-x: auto;
}

.records-table {
  width: 100%;
  border-collapse: collapse;
}

.records-table th, .records-table td {
  padding: 0.75rem;
  text-align: left;
  border-bottom: 1px solid var(--border-color);
  font-size: 0.9rem;
}

.records-table th {
  background-color: #f8fafc;
  font-weight: 700;
  color: var(--text-color);
}

.records-table tr:hover {
  background-color: #f1f5f9;
}

.action-btns {
  display: flex;
  gap: 0.4rem;
}

.btn-icon {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  transition: all 0.15s;
}

.btn-icon-print {
  background-color: #e0f2fe;
  color: #0369a1;
}

.btn-icon-print:hover {
  background-color: #bae6fd;
}

.btn-icon-delete {
  background-color: #fee2e2;
  color: #b91c1c;
}

.btn-icon-delete:hover {
  background-color: #fecaca;
}

/* Badge Styles */
.badge {
  display: inline-block;
  padding: 0.2rem 0.5rem;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 700;
}

.badge-primary {
  background-color: #dbeafe;
  color: #1e40af;
}

.badge-warning {
  background-color: #fef3c7;
  color: #92400e;
}

/* Settings Cog & Modal */
.settings-trigger {
  background: rgba(255,255,255,0.15);
  border: none;
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  transition: all 0.2s;
}
.settings-trigger:hover {
  background: rgba(255,255,255,0.3);
  transform: rotate(30deg);
}

.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal {
  background: white;
  padding: 1.75rem;
  border-radius: 12px;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
.modal-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: #1e3a8a;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.modal-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 0.75rem;
  margin-top: 1.25rem;
}
.refresh-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font-size: 0.8rem;
  color: var(--success-color);
  background-color: #f0fdf4;
  border: 1px solid #bbf7d0;
  padding: 0.2rem 0.5rem;
  border-radius: 6px;
  font-weight: 600;
}

/* ==========================================
   PRINT STYLES (A4 Handover Form)
   ========================================== */
#print-area {
  display: none;
}

@media print {
  body {
    padding: 0;
    background-color: white;
  }
  header,
  main,
  .top-navbar,
  .modal-overlay,
  .portal-container {
    display: none !important;
  }

  #print-area {
    display: block;
    position: static;
    width: 100%;
    margin: 0;
    font-family: "標楷體", "DFKai-SB", "Microsoft JhengHei", sans-serif;
    color: black;
    padding: 10px;
    background-color: white;
  }

  .print-table tr,
  .schedule-table tr {
    page-break-inside: avoid;
  }

  .print-title {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
    letter-spacing: 2px;
    border-bottom: 2px double black;
    padding-bottom: 8px;
  }

  .print-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 15px;
  }

  .print-table th, .print-table td {
    border: 1px solid black;
    padding: 8px 10px;
    font-size: 15px;
  }

  .print-table th {
    text-align: center;
    background-color: #f2f2f2 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    font-weight: bold;
  }

  .print-label {
    font-weight: bold;
    text-align: center;
    background-color: #f9f9f9 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 15%;
  }

  .print-val {
    width: 35%;
  }

  .schedule-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
  }

  .schedule-table th, .schedule-table td {
    border: 1px solid black;
    padding: 6px 8px;
    font-size: 14px;
    text-align: center;
  }

  .schedule-table th {
    font-weight: bold;
    background-color: #e6e6e6 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .schedule-table td.left-align {
    text-align: left;
    padding-left: 12px;
  }

  .print-footer-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 30px;
  }

  .print-footer-table td {
    border: none;
    padding: 10px;
    font-size: 15px;
    text-align: center;
    width: 33.3%;
  }

  .print-note {
    font-size: 12px;
    margin-top: 15px;
    border: 1px solid #999;
    padding: 8px;
    line-height: 1.4;
  }
}
</style>
